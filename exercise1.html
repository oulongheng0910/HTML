
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .counter-container {
            background-color: #f5f5f5;
            border: 2px solid #000;
            padding: 40px 20px; /* Increased top/bottom padding */
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            min-height: 400px; /* Added min-height to make it tall */
            display: flex; /* Flexbox to space out content */
            flex-direction: column; /* Stack items vertically */
            justify-content: space-between; /* Spread content evenly */
            width: 300px; /* Fixed width to maintain proportions */
        }
        .counter-title {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .counter-value {
            color: #27ae60;
            font-size: 48px;
            margin: 20px 0;
        }
        .buttons {
            display: flex;
            justify-content: space-between; /* Space buttons evenly */
            gap: 10px; /* Gap between buttons */
        }
        button {
            padding: 10px 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            flex: 1; /* Make buttons take equal space */
        }
        #decreaseBtn {
            background-color: #7f8c8d;
        }
        #resetBtn {
            background-color: #95a5a6;
        }
        #increaseBtn {
            background-color: #050907;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="counter-container">
        <div class="counter-title">Counter</div>
        <div class="counter-value" id="counterValue">0</div>
        <div class="buttons">
            <button id="decreaseBtn">DECREASE</button>
            <button id="resetBtn">RESET</button>
            <button id="increaseBtn">INCREASE</button>
        </div>
    </div>

    <script>
        class Counter {
            constructor() {
                this.number = 0;
                this.counterValue = document.getElementById('counterValue');
                this.initializeButtons();
            }

            initializeButtons() {
                document.getElementById('decreaseBtn').addEventListener('click', () => this.decrease());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
                document.getElementById('increaseBtn').addEventListener('click', () => this.increase());
            }

            decrease() {
                if (this.number > 0) {
                    this.number--;
                    this.updateDisplay();
                }
            }

            increase() {
                this.number++;
                this.updateDisplay();
            }

            reset() {
                this.number = 0;
                this.updateDisplay();
            }

            updateDisplay() {
                this.counterValue.textContent = this.number;
            }
        }
        
        window.onload = () => new Counter();
    </script>
</body>
</html>
