<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .color-container {
            background-color: #f5f5f5;
            border: 2px solid #000;
            padding: 40px 20px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 300px;
        }
        .color-title {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .color-value {
            color: #27ae60;
            font-size: 24px;
            margin: 20px 0;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            flex: 1;
        }
        #generateBtn {
            background-color: #2ecc71;
        }
        #resetBtn {
            background-color: #95a5a6;
        }
        .records {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="color-container">
        <div class="color-title">Random Color Generator</div>
        <div class="color-value" id="colorValue">Background Color: #FFFFFF</div>
        <div class="buttons">
            <button id="generateBtn">GENERATE</button>
            <button id="resetBtn">RESET</button>
        </div>
        <div class="records" id="records">Generated Colors:</div>
    </div>

    <script>
        class Color {
            constructor() {
                this.records = [];
                this.colorValue = document.getElementById('colorValue');
                this.recordsElement = document.getElementById('records');
                this.initializeButtons();
            }

            initializeButtons() {
                document.getElementById('generateBtn').addEventListener('click', () => this.generate());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
            }

            generate() {
                const color = this.getRandomColor();
                document.body.style.backgroundColor = color;
                this.colorValue.textContent = `Background Color: ${color}`;
                this.records.push(color);
                this.updateRecords();
            }

            getRandomColor() {
                const letters = '0123456789ABCDEF';
                let color = '#';
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            }

            updateRecords() {
                this.recordsElement.innerHTML = `Generated Colors: ${this.records.join(', ')}`;
            }

            reset() {
                document.body.style.backgroundColor = '#f0f0f0';
                this.colorValue.textContent = 'Background Color: #FFFFFF';
                this.records = [];
                this.updateRecords();
            }
        }

        window.onload = () => new Color();
    </script>
</body>
</html>
